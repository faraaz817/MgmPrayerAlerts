name: Build APK

on:
  push:
    paths-ignore:
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  # Never cancel a main build midway through publishing a release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Optional: sign with your own debug key so CI builds install over a locally built app
      # (and over each other) without uninstalling. Without it, each run gets a fresh key.
      - name: Use shared debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            # Accepts raw base64 or certutil output (header lines, CRLF).
            printf '%s\n' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r' | grep -v '^-----' | base64 -d > ~/.android/debug.keystore
            echo "Signing with the shared debug key"
          else
            echo "DEBUG_KEYSTORE_BASE64 not set; signing with a fresh debug key"
          fi

      - name: Read app version
        id: version
        run: |
          version=$(sed -n 's/^ *versionName *= *"\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ -z "$version" ]; then
            echo "::error::versionName not found in app/build.gradle.kts"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "apk=MgmPrayerAlerts-v$version-debug.apk" >> "$GITHUB_OUTPUT"

      - name: Unit tests and debug APK
        run: |
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "${{ steps.version.outputs.apk }}"

      - uses: actions/upload-artifact@v5
        with:
          name: MgmPrayerAlerts-v${{ steps.version.outputs.version }}-debug
          path: ${{ steps.version.outputs.apk }}

      # On main, a versionName without a release yet publishes one, with notes from CHANGELOG.md.
      - name: Publish release for a new version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.version.outputs.apk }}
          SHARED_KEY: ${{ secrets.DEBUG_KEYSTORE_BASE64 != '' }}
        run: .github/scripts/publish-release.sh
