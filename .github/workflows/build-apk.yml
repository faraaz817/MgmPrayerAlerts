name: Build APK

on:
  push:
    paths-ignore:
      - 'app/release/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Optional: sign with your own debug key so CI builds install over a locally built app
      # (and over each other) without uninstalling. Without it, each run gets a fresh key.
      - name: Use shared debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            # Accepts raw base64 or certutil output (header lines, CRLF).
            printf '%s\n' "$DEBUG_KEYSTORE_BASE64" | tr -d '\r' | grep -v '^-----' | base64 -d > ~/.android/debug.keystore
            echo "Signing with the shared debug key"
          else
            echo "DEBUG_KEYSTORE_BASE64 not set; signing with a fresh debug key"
          fi

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit APK to app/release
        run: |
          mkdir -p app/release
          cp app/build/outputs/apk/debug/app-debug.apk app/release/app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/release/app-debug.apk
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update debug APK (built from ${GITHUB_SHA::7})"
          git push origin "HEAD:${GITHUB_REF_NAME}"
